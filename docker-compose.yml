services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor}
      POSTGRES_DB: ${POSTGRES_DB:-monitor}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor} -d ${POSTGRES_DB:-monitor}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor}@db:5432/${POSTGRES_DB:-monitor}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-5}
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-20}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Simulation engine + rule engine. Separate from the API, as the roadmap suggests;
  # the Phase 3 ICMP/SNMPv3 collector will run as its own worker in the same way.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dbdata:
